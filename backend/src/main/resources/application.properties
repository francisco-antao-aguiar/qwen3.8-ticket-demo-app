spring.application.name=ticketshop-backend
server.port=8080

# ---- H2 in-memory database ----
spring.datasource.url=jdbc:h2:mem:ticketshop;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- H2 web console (open http://localhost:8080/h2-console) ----
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ---- Email (local Mailpit / MailHog via Docker, no auth on port 1025) ----
# Start one of:
#   docker run -d --name mailpit -p 1025:1025 -p 8025:8025 axllent/mailpit
#   docker run -d --name mailhog -p 1025:1025 -p 8025:8025 mailhog/mailhog
# Then browse http://localhost:8025 to read the "sent" emails.
# To use a real provider later (e.g. Gmail), override these properties.
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Confirmation emails: To = buyer's email, BCC = watch address below (empty = no BCC)
ticketshop.mail.from=TicketShop <no-reply@ticketshop.local>
ticketshop.mail.bcc=watch@ticketshop.local
